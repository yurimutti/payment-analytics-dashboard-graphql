  CBD_PRODUCTS
  CENSUS_CERT_REQUIRED
  CHARGEBACKS
  CUSTOMER_COMPLAINTS
  CUSTOMER_REQUEST
  DOMAIN_MISMATCH
  HIGH_RISK_GOODS
  ID_VERIFICATION_REQUIRED
  INCOMPLETE_DOCS
  JOINT_OWNERSHIP
  NON_COMMERCIAL_COMPANY_DOCS
  NON_COMPLIANT_WEBSITE
  NOT_COMPLIANT_BUSINESS
  OTHER
  OTHER_COMPANY_WEBSITE
  REAL_HOLDERS_DOCS
