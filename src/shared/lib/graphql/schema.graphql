"""
 Lifecycle state of the merchant's custom hosted-payment-page domain.
- `PENDING_VALIDATION` - Domain provisioning started; waiting for the merchant's DNS records to propagate.
- `SUCCESS` - DNS records detected, certificate validated, and the domain is serving traffic.
- `FAILED` - DNS records were not detected in time; the merchant must disable and start over.
- `PENDING_DELETION` - `disableCustomDomain` was called; teardown can take several minutes.
"""
enum CustomDomainStatus {
  FAILED
  PENDING_DELETION
  PENDING_VALIDATION
  SUCCESS
}

