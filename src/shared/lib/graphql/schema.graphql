"""
 A blacklist (block list) rule. Payments whose attributes match `value` for the given `type` are rejected before authorization.
Rules are scoped to the account that created them; MONEI also maintains a global list applied on top.
"""
type BlacklistItem {
  """
  ID of the account that owns the rule.
  """
  accountId: ID

  """
  Creation date in ISO 8601 format.
  """
  createdAt: String!

  """
  Number of payment attempts this rule has blocked.
  """
  matches: Int

  """
  Free-form note explaining why the rule was added.
  """
  note: String

  """
  Payment attribute this rule matches against.
  """
  type: BlacklistItemType!

  """
  Last update date in ISO 8601 format.
  """
  updatedAt: String

  """
  Manual expiration as a unix timestamp (seconds). The rule stops applying after this time. `null` means the rule never expires.
  """
  validUntil: AWSTimestamp

  """
  Value matched against incoming payments. Format depends on `type` (email address, E.164 phone, IPv4, card fingerprint, session fingerprint, ISO 3166-1 alpha-2 country code).
  """
  value: String!
}

"""
Input for `addBlacklistItem`.
"""
input BlacklistItemInput {
  """
  Free-form note explaining why the rule is being added.
  """
  note: String

  """
  Payment attribute this rule should match against.
  """
  type: BlacklistItemType!

  """
  Manual expiration as a unix timestamp (seconds). Omit for a permanent rule.
  """
  validUntil: AWSTimestamp

  """
  Value to match. Format depends on `type` (email, E.164 phone, IPv4, card fingerprint, session fingerprint, ISO 3166-1 alpha-2 country code).
  """
  value: String!
}

"""
 Blacklist rule kind. Determines which payment attribute the rule's `value` is matched against.
- `email` - Match the customer/billing/shipping email (case-insensitive).
- `phone` - Match the customer/billing/shipping phone (normalized to E.164 before comparison).
- `ip` - Match the payer's session IP address (exact match).
- `card` - Match a card identifier. NOTE: not enforced at payment-validation time; use `card_fingerprint` instead.
- `card_fingerprint` - Match the stable card fingerprint produced by MONEI for the PAN. Same physical card produces the same fingerprint across charges, so blocking one fingerprint blocks every future attempt with that card.
- `session_fingerprint` - Match the device/browser fingerprint captured at checkout (`SessionDetails.fingerprint`). Blocks attempts coming from the same device.
- `country` - Match the payer's session country (ISO 3166-1 alpha-2, geolocated from IP).
"""
enum BlacklistItemType {
  card
  card_fingerprint
  country
  email
  ip
  phone
  session_fingerprint
}

"""
Paginated list of blacklist rules.
"""
type BlacklistItemsConnection {
  """
  Blacklist rules on the current page.
  """
  items: [BlacklistItem!]!

  """
  Cursor for the next page. Pass back as `token` to fetch it. `null` when there are no more results.
  """
  nextToken: String
}

