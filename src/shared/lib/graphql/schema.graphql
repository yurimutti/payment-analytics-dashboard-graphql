- `sepa` - SEPA Direct Debit.
- `klarna` - Klarna buy-now-pay-later.
- `giropay` - giropay, German online bank transfer.
- `srtp` - SEPA Request-to-Pay.
- `eps` - EPS, Austrian online bank transfer.
