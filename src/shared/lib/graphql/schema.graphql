- `MONEI_PAY` - Tap-to-phone (NFC) terminal driven by the MONEI Pay app on Android/iOS.
- `MONEI_POD` - Legacy Bizum-only terminal. Deprecated; use `QR_CODE`. Creation requires `deviceId` on `CreatePointOfSaleInput`.
