  """
  Tax identification number (e.g. NIF/CIF for Spain, VAT ID for EU).
  """
  documentNumber: String

  """
  Merchant IBAN charged for direct debit invoices.
  """
  iban: String

  """
  Registered legal name of the business.
  """
  legalName: String

