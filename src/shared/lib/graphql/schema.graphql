"""
 Acquiring entity that settles funds for transactions routed through a provider.
- `CUSTOM` - Merchant's own acquiring contract.
- `ADYEN` - Adyen.
- `STRIPE` - Stripe.
- `MONEI_X` - MONEI's in-house acquiring (MONEI X).
- `PAYPAL` - PayPal.
- `PAYCOMET` - PAYCOMET.
- `ABANCA` - Abanca (Spain).
- `BANCAMARCH` - Banca March (Spain).
- `BANKIA` - Bankia (Spain).
- `BANKINTER` - Bankinter (Spain).
- `BBVA` - BBVA (Spain).
- `CAJALABORAL` - Caja Laboral / Laboral Kutxa (Spain).
- `CAJAMAR` - Cajamar (Spain).
- `CAJARURAL` - Caja Rural (Spain).
- `CAJASUR` - CajaSur (Spain).
- `COMERCIAGLOBALPAY` - Comercia Global Payments (Spain).
- `CREDITANDORRA` - Crèdit Andorrà (Andorra).
- `KUTXABANK` - Kutxabank (Spain).
- `SABADELL` - Banco Sabadell (Spain).
- `SANTANDER` - Banco Santander (Spain).
- `UNICAJA` - Unicaja (Spain).
- `DEUTSCHE_BANK` - Deutsche Bank.
"""
enum Acquirer {
  ABANCA
  ADYEN
  BANCAMARCH
  BANKIA
  BANKINTER
  BBVA
  CAJALABORAL
  CAJAMAR
  CAJARURAL
  CAJASUR
  COMERCIAGLOBALPAY
