}

"""
 Single line item on an account invoice (e.g. a per-transaction fee, fixed plan fee, or VAT row).
- When `unitType` is `money`, `unitAmount` is in the invoice currency's minor units and `amount = quantity * unitAmount`.
- When `unitType` is `percent`, `unitAmount` is a percentage applied to `quantity` (a base amount in minor units) and `amount = quantity * unitAmount / 100`.
"""
type AccountInvoiceLineItem {
  """
  Computed line total in minor units.
  """
  amount: Int!

  """
  ISO 4217 currency code for this line.
  """
  currency: Currencies!

  """
  Line item description.
  """
  name: String!

  """
  Number of units, or the base amount in minor units when `unitType` is `percent`.
  """
  quantity: Int!

  """
  Per-unit price in minor units (`money`) or percentage value (`percent`).
  """
  unitAmount: Float!

  """
  Whether `unitAmount` is a monetary value or a percentage.
  """
  unitType: UnitType!
}

"""
 Method MONEI uses to collect payment for an account invoice.
- `bank_transfer` - Manual SEPA bank transfer to MONEI.
- `direct_debit` - SEPA Direct Debit charged against the merchant's IBAN.
"""
enum AccountInvoicePaymentMethod {
  bank_transfer
  direct_debit
}

"""
 Payment state of an account invoice that MONEI issues to the merchant.
- `PENDING` - Invoice generated, payment not yet due.
- `PAST_DUE` - Payment deadline passed without successful collection.
- `PAID` - Invoice paid in full.
- `UNPAID` - Invoice not paid (collection failed or cancelled).
"""
enum AccountInvoiceStatus {
  PAID
  PAST_DUE
  PENDING
  UNPAID
}

