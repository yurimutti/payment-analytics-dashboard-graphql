  offlinePin
  onlinePin
}

"""
Automated risk/compliance assessment of the merchant's business website. Generated during onboarding to verify the site is reachable, secure, and compliant with MONEI's website checklist before activating the account.
"""
type WebReport {
  """
  Normalized base URL of the website that was crawled (scheme + host, no path).
  """
  baseUrl: String!

  """
  Whether `riskCategory` falls into a category MONEI does not onboard.
  """
  restricted: Boolean

  """
  Detected business/risk category of the website (used to flag restricted industries).
  """
  riskCategory: String

  """
  Crawl status.
  """
  status: WebReportStatus!

  """
   Reason code when `status` is `FAILED`.
  - `W001` - Website is not accessible.
  - `W002` - Website is not secure (no valid HTTPS).
  - `W003` - Website is blocking requests.
  - `W004` - Website is rate limiting requests.
  - `W005` - Website is not accessible via proxy.
  - `W999` - Unknown error.
  """
  statusCode: String

  """
  Human-readable description of the failure (paired with `statusCode`).
  """
  statusMessage: String

  """
  Whether the crawler determined the website is a placeholder or under construction.
  """
  underConstruction: Boolean
}

"""
 Outcome of an automated website-verification check run during merchant onboarding.
- `PROCESSING` - Crawl is in progress.
- `SUCCEEDED` - Crawl finished. Inspect `riskCategory`, `restricted`, and `underConstruction` for the verdict.
- `FAILED` - Crawl could not be completed. See `statusCode`/`statusMessage`.
"""
enum WebReportStatus {
  FAILED
  PROCESSING
  SUCCEEDED
}

"""
HTTP endpoint that receives MONEI events. Each delivery is signed with the account's API key (`MONEI-Signature: t=<unix>,v1=<hmac-sha256>` over `<unix>.<body>`). Failed deliveries are retried with exponential backoff; the webhook is automatically disabled and `lastResponse` recorded once retries are exhausted.
"""
type Webhook {
  """
  Account that owns the webhook.
  """
  accountId: ID!

  """
  Creation timestamp (ISO 8601).
  """
  createdAt: String!

  """
  Whether the webhook is active. Auto-set to `false` after retries are exhausted.
  """
  enabled: Boolean!

  """
  Event types this webhook subscribes to.
  """
  eventTypes: [WebhookEventType!]!

  """
  Webhook ID.
  """
  id: ID!

  """
  Outcome of the most recent delivery attempt.
  """
  lastResponse: CallbackData

  """
  Sensitive: legacy per-webhook signing secret. New webhooks sign with the account API key; this is kept for backward compatibility.
  """
  secret: String

  """
  Last update timestamp (ISO 8601).
  """
  updatedAt: String

  """
  HTTPS endpoint MONEI POSTs events to.
  """
  url: String!
}

"""
 Event types a webhook can subscribe to. The MONEI server sends an event when the matching object reaches the corresponding state.
- `CHARGE_PENDING` - Charge created, awaiting customer action.
- `CHARGE_PENDING_PROCESSING` - Charge submitted to the processor, awaiting outcome.
- `CHARGE_UPDATED` - Charge fields changed (metadata, descriptors, etc.).
- `CHARGE_AUTHORIZED` - Funds reserved on the card; awaiting capture.
- `CHARGE_REFUNDED` - Charge fully refunded.
- `CHARGE_PARTIALLY_REFUNDED` - Charge refunded for less than the full amount.
- `CHARGE_CAPTURED` - Authorized charge captured.
- `CHARGE_CANCELED` - Authorization voided before capture.
- `CHARGE_SUCCEEDED` - Charge completed successfully.
- `CHARGE_FAILED` - Charge declined or errored.
- `CHARGE_EXPIRED` - Charge expired without completion.
- `CHARGE_CHARGEBACK` - Issuer initiated a chargeback.
- `CHARGE_PAID_OUT` - Funds for the charge included in a settlement payout.
- `SETTLEMENT_COMPLETED` - Settlement transferred to the merchant's bank account.
- `SETTLEMENT_PENDING` - Settlement scheduled, not yet released.
- `SETTLEMENT_SUSPENDED` - Settlement held (risk/compliance review).
- `SUBSCRIPTION_PENDING` - Subscription created, awaiting first payment.
- `SUBSCRIPTION_EXPIRED` - Subscription ended (e.g. fixed term reached, max retries exhausted).
- `SUBSCRIPTION_TRIALING` - Subscription is in its trial period.
- `SUBSCRIPTION_ACTIVATED` - Subscription is active and billing.
- `SUBSCRIPTION_CANCELED` - Subscription canceled.
- `SUBSCRIPTION_PAUSED` - Subscription paused.
- `SUBSCRIPTION_PAST_DUE` - Renewal payment failed; subscription is in dunning.
- `SUBSCRIPTION_UPDATED` - Subscription fields changed.
- `ACCOUNT_INVOICE_PAID` - MONEI invoice for the merchant account paid.
- `ACCOUNT_INVOICE_UNPAID` - MONEI invoice unpaid after the due date.
- `ACCOUNT_INVOICE_PENDING` - MONEI invoice issued, payment pending.
- `ACCOUNT_INVOICE_PAST_DUE` - MONEI invoice past due.
"""
enum WebhookEventType {
  ACCOUNT_INVOICE_PAID
  ACCOUNT_INVOICE_PAST_DUE
  ACCOUNT_INVOICE_PENDING
  ACCOUNT_INVOICE_UNPAID
  CHARGE_AUTHORIZED
  CHARGE_CANCELED
  CHARGE_CAPTURED
  CHARGE_CHARGEBACK
  CHARGE_EXPIRED
  CHARGE_FAILED
  CHARGE_PAID_OUT
  CHARGE_PARTIALLY_REFUNDED
  CHARGE_PENDING
  CHARGE_PENDING_PROCESSING
  CHARGE_REFUNDED
  CHARGE_SUCCEEDED
  CHARGE_UPDATED
  SETTLEMENT_COMPLETED
  SETTLEMENT_PENDING
  SETTLEMENT_SUSPENDED
  SUBSCRIPTION_ACTIVATED
  SUBSCRIPTION_CANCELED
  SUBSCRIPTION_EXPIRED
  SUBSCRIPTION_PAST_DUE
  SUBSCRIPTION_PAUSED
  SUBSCRIPTION_PENDING
  SUBSCRIPTION_TRIALING
  SUBSCRIPTION_UPDATED
}

