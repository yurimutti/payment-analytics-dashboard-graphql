<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1" />
    </marker>
    <marker id="arr-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981" />
    </marker>
    <marker id="arr-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="1000" height="480" fill="#0b0f1a" />

  <!-- Lane label: Request -->
  <text x="500" y="34" text-anchor="middle" fill="#6366f1" font-size="13" font-weight="600" letter-spacing="0.14em">REQUEST  →</text>
  <text x="500" y="316" text-anchor="middle" fill="#10b981" font-size="13" font-weight="600" letter-spacing="0.14em">←  RESPONSE</text>

  <!-- React UI -->
  <g>
    <rect x="40" y="60" width="170" height="100" rx="14" fill="#1e1b4b" stroke="#4338ca" />
    <text x="125" y="92" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="0.08em">REACT</text>
    <text x="125" y="118" text-anchor="middle" fill="#e0e7ff" font-size="14" font-weight="600">Page / Component</text>
    <text x="125" y="138" text-anchor="middle" fill="#a5b4fc" font-size="11">renders loading /</text>
    <text x="125" y="152" text-anchor="middle" fill="#a5b4fc" font-size="11">error / empty / data</text>
  </g>

  <!-- Hook -->
  <g>
    <rect x="240" y="60" width="170" height="100" rx="14" fill="#1e1b4b" stroke="#4338ca" />
    <text x="325" y="92" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="0.08em">HOOK</text>
    <text x="325" y="118" text-anchor="middle" fill="#e0e7ff" font-size="14" font-weight="600">use-*-query.ts</text>
    <text x="325" y="138" text-anchor="middle" fill="#a5b4fc" font-size="11">wraps useQuery,</text>
    <text x="325" y="152" text-anchor="middle" fill="#a5b4fc" font-size="11">parses errors</text>
  </g>

  <!-- Apollo Client -->
  <g>
    <rect x="440" y="60" width="200" height="100" rx="14" fill="#3b0764" stroke="#7e22ce" />
    <text x="540" y="92" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="0.08em">APOLLO CLIENT</text>
    <text x="540" y="118" text-anchor="middle" fill="#f3e8ff" font-size="14" font-weight="600">InMemoryCache</text>
    <text x="540" y="138" text-anchor="middle" fill="#d8b4fe" font-size="11">cache-and-network</text>
    <text x="540" y="152" text-anchor="middle" fill="#d8b4fe" font-size="11">errorPolicy: "all"</text>
  </g>

  <!-- Vite proxy -->
  <g>
    <rect x="670" y="60" width="180" height="100" rx="14" fill="#0f172a" stroke="#334155" />
    <text x="760" y="92" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="0.08em">VITE DEV PROXY</text>
    <text x="760" y="118" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600" font-family="ui-monospace, monospace">/api/graphql</text>
    <text x="760" y="138" text-anchor="middle" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">+ Authorization:</text>
    <text x="760" y="152" text-anchor="middle" fill="#fbbf24" font-size="11" font-family="ui-monospace, monospace">  API_KEY</text>
  </g>

  <!-- GraphQL API -->
  <g>
    <ellipse cx="930" cy="110" rx="60" ry="50" fill="#0c1320" stroke="#334155" />
    <text x="930" y="105" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">GraphQL</text>
    <text x="930" y="123" text-anchor="middle" fill="#94a3b8" font-size="11">upstream</text>
  </g>

  <!-- Request arrows (top, indigo) -->
  <line x1="210" y1="100" x2="238" y2="100" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr)" />
  <line x1="410" y1="100" x2="438" y2="100" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr)" />
  <line x1="640" y1="100" x2="668" y2="100" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr)" />
  <line x1="850" y1="100" x2="868" y2="100" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr)" />

  <!-- Response arrows (bottom, green) -->
  <line x1="868" y1="135" x2="850" y2="135" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-back)" />
  <line x1="668" y1="135" x2="640" y2="135" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-back)" />
  <line x1="438" y1="135" x2="410" y2="135" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-back)" />
  <line x1="238" y1="135" x2="210" y2="135" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-back)" />

  <!-- Codegen side feed -->
  <g>
    <rect x="240" y="220" width="170" height="70" rx="12" fill="#0c1320" stroke="#1f2937" />
    <text x="325" y="242" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="0.08em">BUILD STEP</text>
    <text x="325" y="265" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">GraphQL Codegen</text>
    <text x="325" y="282" text-anchor="middle" fill="#94a3b8" font-size="11">typed data + variables</text>
  </g>
  <line x1="325" y1="220" x2="325" y2="165" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-dash)" />
  <text x="332" y="195" fill="#94a3b8" font-size="11" font-style="italic">types</text>

  <!-- Env validation -->
  <g>
    <rect x="440" y="220" width="200" height="70" rx="12" fill="#0c1320" stroke="#1f2937" />
    <text x="540" y="242" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="0.08em">STARTUP</text>
    <text x="540" y="265" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">env (T3 + Zod)</text>
    <text x="540" y="282" text-anchor="middle" fill="#94a3b8" font-size="11">fail-fast typed config</text>
  </g>
  <line x1="540" y1="220" x2="540" y2="165" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-dash)" />
  <text x="548" y="195" fill="#94a3b8" font-size="11" font-style="italic">VITE_GRAPHQL_ENDPOINT</text>

  <!-- Test layers -->
  <g>
    <rect x="40" y="350" width="600" height="105" rx="14" fill="#0c1320" stroke="#1f2937" />
    <text x="60" y="378" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.08em">TEST LAYERS</text>

    <g>
      <rect x="60" y="392" width="160" height="50" rx="10" fill="#0f172a" stroke="#334155" />
      <text x="140" y="414" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Vitest + RTL</text>
      <text x="140" y="430" text-anchor="middle" fill="#94a3b8" font-size="11">MockedProvider</text>
    </g>

    <g>
      <rect x="240" y="392" width="160" height="50" rx="10" fill="#0f172a" stroke="#334155" />
      <text x="320" y="414" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Playwright</text>
      <text x="320" y="430" text-anchor="middle" fill="#94a3b8" font-size="11">live HTTP via proxy</text>
    </g>

    <g>
      <rect x="420" y="392" width="200" height="50" rx="10" fill="#0f172a" stroke="#334155" />
      <text x="520" y="414" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Native TanStack Router</text>
      <text x="520" y="430" text-anchor="middle" fill="#94a3b8" font-size="11">in-memory, no vi.mock</text>
    </g>
  </g>

  <line x1="140" y1="392" x2="290" y2="165" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-dash)" />
  <line x1="320" y1="392" x2="720" y2="165" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr-dash)" />
</svg>
